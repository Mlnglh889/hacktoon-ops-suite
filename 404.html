<html class="dark" lang="en" translate="yes">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hacktoon-ops-suite/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portaldot Stake Hub — Non-Custodial Staking Protocol</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Static-archive shim (18 Nov 2026): the live backend was retired, so every
      // /api/v3/<path> read is served from a frozen snapshot shipped with this build.
      (function () {
        var realFetch = window.fetch.bind(window);
        function base() {
          var b = document.querySelector('script[type="module"][src]');
          if (b && b.src) return b.src.replace(/assets\/[^/]*$/, '');
          return '/';
        }
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : input && input.url;
          if (url && (url.indexOf('/api/v3/') === 0 || url.indexOf('/api/v1/') === 0)) {
            var key = url.split('?')[0].replace(/^\/api\/v[13]\//, '').replace(/\//g, '_');
            var target = base() + 'api/v3/' + key + '.json';
            return realFetch(target, init).then(function (r) {
              if (!r.ok) throw new Error('static snapshot missing: ' + target);
              return r;
            });
          }
          return realFetch(input, init);
        };
        window.addEventListener('DOMContentLoaded', function () {
          realFetch(base() + 'api/v3/manifest.json', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (m) {
              if (!m) return;
              var when = new Date(m.snapshot_taken_at * 1000).toLocaleString();
              var bar = document.createElement('div');
              bar.setAttribute('role', 'status');
              bar.style.cssText = 'position:sticky;top:0;z-index:9999;background:#422006;color:#fde68a;' +
                'font:600 12px/1.5 Inter,system-ui,sans-serif;padding:8px 14px;text-align:center;border-bottom:1px solid #78350f';
              bar.textContent = 'Static archive · last measured block #' + m.snapshot_block +
                ', era ' + m.snapshot_era + ' (' + when + ') · live API retired 18 Nov 2026';
              document.body.insertBefore(bar, document.body.firstChild);
            })
            .catch(function () {});
        });
      })();
    </script>
    <script type="module" crossorigin src="/hacktoon-ops-suite/assets/index-w2yCW-cg.js"></script>
    <link rel="stylesheet" crossorigin href="/hacktoon-ops-suite/assets/index-BaIOmrDG.css">
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;background:#020617;color:#f8fafc;font-family:Inter,system-ui,sans-serif;padding:32px;display:grid;place-items:center;text-align:center">
        <div>
          <div style="font-size:12px;letter-spacing:.18em;color:#a78bfa;font-weight:700">PORTALDOT STAKE HUB</div>
          <h1 style="font-size:32px;margin:16px 0 8px">Stake Smarter. Choose Better.</h1>
          <p style="color:#94a3b8;max-width:440px;margin:0 auto">Loading the archived Portaldot staking dashboard…</p>
          <noscript><p style="color:#fbbf24;margin-top:20px">JavaScript is disabled. Enable JavaScript to open the dashboard.</p></noscript>
        </div>
      </main>
    </div>
  </body>
</html>
