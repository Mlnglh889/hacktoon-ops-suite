name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r apps/stake-hub/backend/requirements.txt
      - name: Run backend tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stake-hub/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/stake-hub/apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build Vite app
        run: npm run build
      - name: Frontend unit tests
        working-directory: .
        run: npx tsx --test apps/stake-hub/apps/web/src/lib/*.test.ts
